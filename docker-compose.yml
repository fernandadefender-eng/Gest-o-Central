services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atendimento
      # Senha no .env da raiz (não versionado); trocada em 18/09/2026
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env da raiz}
      POSTGRES_DB: atendimento
    # 127.0.0.1: só este computador acessa. Sem isso o banco fica aberto para a rede local.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis não tem senha aqui: por isso só aceita conexão local.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
